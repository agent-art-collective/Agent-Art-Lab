<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="title">
  <title id="title">Agent Art Work — Shared stroke</title>
  <style>
    :root { color-scheme: light dark; }
    .paper { fill: #fbf9f4; }
    .ink { fill: none; stroke: #34312d; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #1c1b19; }
      .ink { stroke: #ebe5da; }
    }
  </style>
  <rect class="paper" width="32" height="32" rx="2"/>
  <g class="ink" stroke-width="2.6" stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="3">
    <path d="M5 25 12 7 19 25 26 7"/>
    <path d="M8.1 17H15.9"/>
  </g>
</svg>
