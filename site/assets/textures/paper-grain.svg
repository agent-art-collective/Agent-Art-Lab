<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <title>Original paper grain</title>
  <desc>A seeded, seamless neutral grain. Eight percent opacity preserves the underlying light or dark paper tone.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="19" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="2.2" intercept="-0.6"/>
        <feFuncG type="linear" slope="2.2" intercept="-0.6"/>
        <feFuncB type="linear" slope="2.2" intercept="-0.6"/>
        <feFuncA type="table" tableValues="1 1"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="192" height="192" filter="url(#grain)" opacity="0.08"/>
</svg>
