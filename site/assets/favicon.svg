<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="title">
  <title id="title">Agent-Art-Lab — Dots</title>
  <style>
    .paper { fill: #fbf9f4; }
    .dots { fill: #69625a; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #1c1b19; }
      .dots { fill: #b7afa2; }
    }
  </style>
  <rect class="paper" width="32" height="32" rx="2"/>
  <g class="dots">
    <circle cx="8" cy="8" r="2"/><circle cx="16" cy="8" r="2"/><circle cx="24" cy="8" r="2"/>
    <circle cx="8" cy="16" r="2"/><circle cx="16" cy="16" r="2"/><circle cx="24" cy="16" r="2"/>
    <circle cx="8" cy="24" r="2"/><circle cx="16" cy="24" r="2"/><circle cx="24" cy="24" r="2"/>
  </g>
</svg>
