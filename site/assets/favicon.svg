<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="title">
  <title id="title">Agent-Art-Lab — Dots</title>
  <style>
    .paper { fill: #fbf9f4; }
    .dots { fill: #69625a; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #1c1b19; }
      .dots { fill: #b7afa2; }
    }
  </style>
  <rect class="paper" width="32" height="32" rx="2"/>
  <g class="dots">
    <circle cx="4" cy="4" r="1.4"/><circle cx="10" cy="4" r="1.4"/><circle cx="16" cy="4" r="1.4"/><circle cx="22" cy="4" r="1.4"/><circle cx="28" cy="4" r="1.4"/>
    <circle cx="4" cy="10" r="1.4"/><circle cx="10" cy="10" r="1.4"/><circle cx="16" cy="10" r="1.4"/><circle cx="22" cy="10" r="1.4"/><circle cx="28" cy="10" r="1.4"/>
    <circle cx="4" cy="16" r="1.4"/><circle cx="10" cy="16" r="1.4"/><circle cx="16" cy="16" r="1.4"/><circle cx="22" cy="16" r="1.4"/><circle cx="28" cy="16" r="1.4"/>
    <circle cx="4" cy="22" r="1.4"/><circle cx="10" cy="22" r="1.4"/><circle cx="16" cy="22" r="1.4"/><circle cx="22" cy="22" r="1.4"/><circle cx="28" cy="22" r="1.4"/>
    <circle cx="4" cy="28" r="1.4"/><circle cx="10" cy="28" r="1.4"/><circle cx="16" cy="28" r="1.4"/><circle cx="22" cy="28" r="1.4"/><circle cx="28" cy="28" r="1.4"/>
  </g>
</svg>
